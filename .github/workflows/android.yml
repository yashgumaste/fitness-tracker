name: Build Android app

# Nightly beta: builds at 2:00 AM India time, only if something changed since the last release.
# Run it by hand from the Actions tab (Run workflow) for an urgent build.
on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST backup; the nightly build is started at 1:41 AM IST by a scheduled Claude task
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK as a release (untick for a test build)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: c
        name: Anything new since the last release?
        run: |
          # the changelog commit CI makes after each release doesn't count as a change
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          # only changes to the app itself count (not docs, CLAUDE.md, the workflow or the changelog commit)
          N=$(git log --no-merges --format= --name-only ${LAST:+$LAST..}HEAD | grep -cE '^(src/|native/|scripts/|assets/|package\.json|capacitor\.config\.json)' || true)
          if [ "${N:-0}" = "0" ]; then echo "changed=false" >> $GITHUB_OUTPUT; echo "No changes — skipping tonight's build"
          else echo "changed=true" >> $GITHUB_OUTPUT; echo "$N change(s) since ${LAST:-the start}"; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Signing key present?
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets (Settings → Secrets and variables → Actions)"; exit 1; fi

      # Build numbers continue from the old private repo (last release there was 1.6),
      # so new versions always install over old ones.
      - name: Version number
        run: |
          echo "BUILD=$((GITHUB_RUN_NUMBER + 10))" >> $GITHUB_ENV
          echo "APP_VERSION=1.$((GITHUB_RUN_NUMBER + 10))" >> $GITHUB_ENV

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: What's new (changelog.json → this version, release notes)
        run: node scripts/changelog.cjs stamp "$APP_VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build the app page
        run: node scripts/build-web.cjs
        env:
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY }}

      - name: Test the app (sample data, every page and panel, AI faked)
        run: |
          npx playwright install --with-deps chromium
          node tests/smoke.cjs

      - name: Keep screenshots of failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

      - name: Create the Android project
        run: npx cap add android

      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor "#000000" --iconBackgroundColorDark "#000000" --splashBackgroundColor "#000000" --splashBackgroundColorDark "#000000"

      - name: Android settings (permissions, version, notification icon)
        run: node scripts/patch-android.cjs
        env:
          RUN: ${{ env.BUILD }}

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK (key comes from the repository secrets, never from the code)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias fitness \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "FitnessTracker-$APP_VERSION.apk" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "FitnessTracker-$APP_VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the test APK
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: FitnessTracker-*.apk
          retention-days: 3

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Fitness Tracker ${{ env.APP_VERSION }} (nightly beta)
          make_latest: true
          files: FitnessTracker-${{ env.APP_VERSION }}.apk
          body_path: release-notes.md

      - name: Save the changelog
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.json
          git commit -q -m "Changelog: $APP_VERSION" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1
