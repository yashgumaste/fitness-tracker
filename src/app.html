<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
<meta name="theme-color" content="#000000"/>
<title>Fitness Tracker</title>
<!-- Instant dark background — painted before ANY script or style loads -->
<style>html,body{background:#000;margin:0;padding:0;}/* ═══════════════════════════════════════════════════════════════
   EXPRESSIVE KIT — every screen is built from these
   ═══════════════════════════════════════════════════════════════ */
.x-wrap{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.x-head{padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.x-head h1{margin:0;font-family:var(--font-ui);font-stretch:125%;font-weight:850;font-size:32px;line-height:1.02;letter-spacing:-.015em;color:var(--fg);}
.x-eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:750;color:var(--fg3);}
.x-num{font-family:var(--font-ui);font-stretch:122%;font-weight:850;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em;}
.x-h2{margin:0;font-family:var(--font-ui);font-stretch:118%;font-weight:820;font-size:20px;line-height:1.15;color:var(--fg);}
.x-sub{font-size:13px;color:var(--fg2);font-weight:550;line-height:1.35;}
.x-dim{color:var(--fg3);}

/* Connected button group (segmented) — selected segment morphs to a pill */
.x-seg{display:flex;gap:3px;background:transparent;}
.x-seg>button{flex:1;min-height:44px;border:none;background:var(--s3);color:var(--fg2);font-weight:750;font-size:14px;padding:0 14px;
  border-radius:10px;transition:border-radius .32s var(--spring)!important;white-space:nowrap;}
.x-seg>button:first-child{border-radius:22px 10px 10px 22px;}
.x-seg>button:last-child{border-radius:10px 22px 22px 10px;}
.x-seg>button.on{background:var(--pri);color:var(--on-pri);border-radius:22px;}

/* Cards with expressive corner sets */
.x-card{background:var(--s2);border-radius:28px;padding:16px;color:var(--fg);min-width:0;border:none;text-align:left;display:block;width:100%;}
.x-card.sa{border-radius:40px 18px 40px 18px;}
.x-card.sb{border-radius:18px 40px 18px 40px;}
.x-card.sc{border-radius:40px 40px 18px 18px;}
.x-card.pri{background:var(--pri-c);color:var(--on-pri-c);}
.x-card.mint{background:var(--mint-c);color:var(--on-mint-c);}
.x-card.violet{background:var(--violet-c);color:var(--on-violet-c);}
.x-card.amber{background:var(--amber-c);color:var(--on-amber-c);}
.x-card.pink{background:var(--pink-c);color:var(--on-pink-c);}
.x-card.err{background:var(--err-c);color:var(--on-err-c);}
button.x-card:active{filter:brightness(1.12);}

/* Section header */
.x-sec{display:flex;align-items:center;gap:10px;margin:10px 4px 0;}
.x-sec .x-h2{flex:1;}

/* Buttons */
.x-btn{border:none;min-height:48px;padding:0 22px;border-radius:24px;background:var(--pri);color:var(--on-pri);font-weight:800;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-radius .28s var(--spring)!important;}
.x-btn:active:not(:disabled){border-radius:14px;}
.x-btn:disabled{background:var(--s4);color:var(--fg3);}
.x-btn.tonal{background:var(--pri-c);color:var(--on-pri-c);}
.x-btn.outline{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--outline-var);}
.x-btn.danger{background:var(--err);color:var(--on-err);}
.x-btn.ghost{background:transparent;color:var(--pri);padding:0 12px;}
.x-btn.sm{min-height:38px;padding:0 16px;font-size:13px;border-radius:19px;}
.x-btn.wide{width:100%;}
.x-ibtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--s3);color:var(--fg);display:grid;place-items:center;font-size:18px;flex:none;
  transition:border-radius .28s var(--spring)!important;}
.x-ibtn:active{border-radius:14px;}
.x-ibtn.pri{background:var(--pri);color:var(--on-pri);}
.x-ibtn.tonal{background:var(--pri-c);color:var(--on-pri-c);}
.x-ibtn.sm{width:36px;height:36px;font-size:15px;}

/* Chips */
.x-chips{display:flex;flex-wrap:wrap;gap:6px;}
.x-chip{border:none;min-height:34px;padding:0 13px;border-radius:12px;background:var(--s3);color:var(--fg2);font-weight:700;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;transition:border-radius .25s var(--spring)!important;white-space:nowrap;}
.x-chip.on{background:var(--pri);color:var(--on-pri);border-radius:17px;}
.x-chip.mint{background:var(--mint-c);color:var(--on-mint-c);}
.x-chip.amber{background:var(--amber-c);color:var(--on-amber-c);}
.x-chip.pink{background:var(--pink-c);color:var(--on-pink-c);}
.x-chip.violet{background:var(--violet-c);color:var(--on-violet-c);}
.x-chip.err{background:var(--err-c);color:var(--on-err-c);}
.x-chip.pri{background:var(--pri-c);color:var(--on-pri-c);}
.x-chip.dash{background:transparent;box-shadow:inset 0 0 0 1.5px var(--outline-var);color:var(--fg2);}
.x-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:750;background:var(--s3);color:var(--fg2);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* Lists */
.x-list{display:flex;flex-direction:column;gap:3px;}
.x-item{display:flex;align-items:center;gap:12px;width:100%;border:none;text-align:left;color:var(--fg);background:var(--s2);border-radius:8px;padding:12px 14px;min-height:60px;}
.x-list>.x-item:first-child{border-top-left-radius:26px;border-top-right-radius:26px;}
.x-list>.x-item:last-child{border-bottom-left-radius:26px;border-bottom-right-radius:26px;}
.x-list>.x-item:only-child{border-radius:26px;}
button.x-item:active{background:var(--s3);}
.x-item .t{font-weight:720;font-size:15px;line-height:1.3;overflow-wrap:anywhere;}
.x-item .s{font-size:12.5px;color:var(--fg2);margin-top:2px;font-variant-numeric:tabular-nums;}

/* Fields */
.x-lab{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:750;color:var(--fg2);min-width:0;}
.x-field{width:100%;min-width:0;background:var(--s3);color:var(--fg);border:2px solid transparent;border-radius:18px;padding:12px 14px;font-size:17px;font-weight:600;
  outline:none;font-family:inherit;text-transform:none;letter-spacing:0;}
.x-field:focus{border-color:var(--pri);background:var(--s1);}
.x-field::placeholder{color:var(--fg3);font-weight:500;}
textarea.x-field{resize:none;line-height:1.45;}
.x-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
.x-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}

/* Stepper */
.x-step{display:flex;align-items:center;gap:6px;background:var(--s3);border-radius:22px;padding:4px;}
.x-step button{width:40px;height:40px;border-radius:20px;border:none;background:var(--s4);color:var(--fg);font-size:20px;font-weight:800;}
.x-step b{flex:1;text-align:center;}

/* Stat tile */
.x-stat{background:var(--s2);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.x-stat small{font-size:12px;font-weight:750;color:var(--fg2);}
.x-stat b{font-family:var(--font-ui);font-stretch:120%;font-weight:850;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;}
.x-stat i{font-style:normal;font-size:12px;color:var(--fg3);font-weight:600;}

/* Sheet (bottom) */
.x-sheetpage{min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:var(--bg);padding-top:56px;}
.x-sheet{width:100%;max-width:560px;background:var(--s1);border-radius:36px 36px 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 var(--line);}
.x-grab{width:40px;height:5px;border-radius:3px;background:var(--s4);margin:4px auto 14px;}
.x-sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;}
.x-sheet-head h2{margin:0;font-family:var(--font-ui);font-stretch:122%;font-weight:850;font-size:26px;line-height:1.1;}
.x-sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;}

/* Snackbar */
.x-snack{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;z-index:500;bottom:calc(100px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);font-weight:750;font-size:14px;padding:12px 18px;border-radius:16px;max-width:calc(100vw - 32px);
  display:flex;align-items:center;gap:10px;}
.x-range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:0;border-radius:22px;outline:none;cursor:pointer;}
.x-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:58px;border-radius:5px;background:#fff;box-shadow:0 0 0 4px #000;}
.x-range::-moz-range-thumb{width:10px;height:58px;border-radius:5px;background:#fff;border:4px solid #000;}
.x-snack i{width:8px;height:8px;border-radius:50%;flex:none;}

/* Home date strip */
.x-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 12px;}
.x-day{border:none;background:transparent;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:20px;}
.x-day.on{background:var(--s2);color:var(--fg);}
.x-day small{font-size:11px;font-weight:750;letter-spacing:.06em;}
.x-day .dots{display:flex;gap:3px;height:5px;}
.x-day .dots i{width:5px;height:5px;border-radius:50%;background:var(--s4);}

/* Timeline (grouped) */
.x-tl-group{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);margin:14px 6px 6px;}
.x-tl{display:flex;flex-direction:column;gap:3px;}
.x-tl>button{display:flex;align-items:center;gap:12px;border:none;background:var(--s2);color:var(--fg);text-align:left;padding:10px 14px 10px 10px;border-radius:8px;min-height:64px;width:100%;}
.x-tl>button:first-child{border-top-left-radius:24px;border-top-right-radius:24px;}
.x-tl>button:last-child{border-bottom-left-radius:24px;border-bottom-right-radius:24px;}
.x-tl>button:active{background:var(--s3);}
.x-tl .tm{margin-left:auto;align-self:flex-start;padding-top:4px;font-size:12px;font-weight:750;color:var(--fg3);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* Meal sections */
.x-meal{background:var(--s1);border-radius:30px;padding:8px;}
.x-meal-head{display:flex;align-items:center;gap:12px;padding:6px 6px 8px 6px;}
.x-entry{display:flex;gap:12px;align-items:flex-start;width:100%;border:none;text-align:left;background:var(--s2);color:var(--fg);border-radius:8px;padding:12px 14px;margin-top:3px;}
.x-entry:first-of-type{border-top-left-radius:22px;border-top-right-radius:22px;}
.x-entry:last-of-type{border-bottom-left-radius:22px;border-bottom-right-radius:22px;}
.x-entry:active{background:var(--s3);}

/* Calendar month grid */
.x-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;}
.x-cal>button,.x-cal>div{aspect-ratio:1;border:none;background:transparent;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--fg2);font-weight:750;font-size:14px;font-variant-numeric:tabular-nums;}

/* Exercise rows */
.x-ex{display:flex;align-items:center;gap:12px;width:100%;border:none;text-align:left;background:var(--s2);color:var(--fg);border-radius:8px;padding:12px 14px 12px 10px;min-height:72px;}
.x-ex-list{display:flex;flex-direction:column;gap:3px;}
.x-ex-list>.x-ex:first-child{border-top-left-radius:28px;border-top-right-radius:28px;}
.x-ex-list>.x-ex:last-child{border-bottom-left-radius:28px;border-bottom-right-radius:28px;}
.x-ex.done{background:color-mix(in srgb, var(--mint) 12%, var(--s2));}
.x-check{width:46px;height:46px;flex:none;border:none;background:transparent;padding:0;display:grid;place-items:center;}

/* Sets table */
.x-sets{display:flex;flex-direction:column;gap:6px;}
.x-set{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.3fr) 40px;gap:8px;align-items:center;}
.x-set .n{width:30px;height:30px;border-radius:15px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--fg2);}
.x-unit{border:none;border-radius:12px;background:var(--s4);color:var(--fg);font-weight:800;font-size:13px;min-width:46px;min-height:44px;padding:0 8px;}

/* Belly map tiles */
.x-belly{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:14px 14px 18px;background:var(--s2);border-radius:60px 60px 70px 70px;}
.x-belly button{border:none;min-height:54px;border-radius:14px;background:var(--s3);color:var(--fg2);font-weight:750;font-size:12px;line-height:1.15;padding:4px;}
.x-belly button.on{background:var(--pink);color:#2a0020;border-radius:24px;}

/* water: a drop falls into the glass, splashes, the level rises */
@keyframes lm-drop{0%{transform:translateY(-44px) scale(.7);opacity:0}12%{opacity:1}82%{opacity:1}100%{transform:translateY(var(--fall)) scale(1,1.15);opacity:0}}
@keyframes lm-splash-l{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-9px,-11px);opacity:0}}
@keyframes lm-splash-r{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(9px,-10px);opacity:0}}
@keyframes lm-ripple{0%{transform:scale(.2,.2);opacity:.9}100%{transform:scale(1.5,1);opacity:0}}
@keyframes lm-slosh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes lm-grow{from{transform:scaleY(0)}}
@keyframes lm-grow-x{from{transform:scaleX(0)}}
.lm-grow-x{transform-origin:0 50%;animation:lm-grow-x .6s cubic-bezier(.3,1.2,.5,1) both}
@keyframes lm-ping{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.lm-ping{transform-box:fill-box;transform-origin:center;animation:lm-ping 1.6s ease-out infinite}
.lm-grow{transform-box:fill-box;transform-origin:50% 100%;animation:lm-grow .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes lm-bump{0%{transform:scale(1)}35%{transform:scale(1.18)}65%{transform:scale(.95)}100%{transform:scale(1)}}
.lm-drop{animation:lm-drop .46s cubic-bezier(.55,0,1,.6) both}
.lm-splash-l{animation:lm-splash-l .42s ease-out both;transform-box:fill-box}
.lm-splash-r{animation:lm-splash-r .42s ease-out both;transform-box:fill-box}
.lm-ripple{animation:lm-ripple .55s ease-out both;transform-box:fill-box;transform-origin:center}
.lm-slosh{animation:lm-slosh .9s ease-in-out both}
.lm-bump{animation:lm-bump .5s cubic-bezier(.3,1.5,.5,1)}
@media (prefers-reduced-motion:reduce){.lm-drop,.lm-splash-l,.lm-splash-r,.lm-ripple{animation:none!important;opacity:0}.lm-slosh,.lm-bump,.lm-grow,.lm-grow-x,.lm-ping{animation:none!important}}
</style>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* ══════════════════════════════════════════════════════════════
   MATERIAL YOU (MATERIAL DESIGN 3) — TONAL PALETTE
   Seed color: deep teal-blue (#0a5c5c-ish hue family)
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ═══ Material 3 Expressive · Vibrant · pitch black ═══
     --pri is the accent (default #00FFFF, changeable in Settings). Everything else derives from it
     or from the fixed companion hues (violet = protein, amber = carbs, pink = fat, mint = goal met). */
  color-scheme:dark;
  --pri:#00FFFF; --on-pri:#001F21;
  --pri-c:color-mix(in srgb, var(--pri) 30%, #000); --on-pri-c:color-mix(in srgb, var(--pri) 45%, #fff);
  --s0:#000000; --s1:#0B1112; --s2:#131B1D; --s3:#1C2628; --s4:#263235;
  --fg:#EAFEFE; --fg2:#A4BEC0; --fg3:#6F888A; --line:#2B3B3E;
  --pink:#FF6FD1; --pink-c:#4A0E3C; --on-pink-c:#FFD5F2;
  --amber:#FFC247; --amber-c:#463000; --on-amber-c:#FFE5B0;
  --violet:#B9A2FF; --violet-c:#2C1D63; --on-violet-c:#E5DBFF;
  --mint:#5CF2A6; --mint-c:#00391F; --on-mint-c:#B8FFD9;
  --err:#FF6B6B; --err-c:#561313; --on-err-c:#FFD6D6;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --dock-h:72px;
  --sky:#7AB8FF; --sky-c:#0E2C4F; --on-sky-c:#D3E6FF; --night:#B4AEFF; --night-c:#27235C; --on-night-c:#E4E0FF; --on-err:#000; --dock-ic:#000;

  /* legacy names used across the app → new palette */
  --md-sys-color-background:var(--s0);
  --md-sys-color-surface:var(--s0);
  --md-sys-color-surface-variant:var(--s4);
  --md-sys-color-surface-container:var(--s2);
  --md-sys-color-surface-container-high:var(--s3);
  --md-sys-color-surface-container-low:var(--s1);
  --md-sys-color-primary:var(--pri);
  --md-sys-color-on-primary:var(--on-pri);
  --md-sys-color-primary-container:var(--pri-c);
  --md-sys-color-on-primary-container:var(--on-pri-c);
  --md-sys-color-secondary:var(--pri);
  --md-sys-color-on-secondary:var(--on-pri);
  --md-sys-color-secondary-container:var(--pri-c);
  --md-sys-color-on-secondary-container:var(--on-pri-c);
  --md-sys-color-on-surface:var(--fg);
  --md-sys-color-on-surface-variant:var(--fg2);
  --md-sys-color-outline:var(--fg3);
  --md-sys-color-outline-variant:var(--line);
  --md-sys-color-error:var(--err);
  --md-sys-color-on-error:#000;
  --md-sys-color-error-container:var(--err-c);
  --acc:var(--pri);
  --acc-dim:color-mix(in srgb, var(--pri) 14%, transparent);
  --acc-mid:color-mix(in srgb, var(--pri) 24%, transparent);
  --acc-glow:color-mix(in srgb, var(--pri) 9%, transparent);
  --surf:var(--s1); --surf2:var(--s2); --surf3:var(--s3);
  --on-surf:var(--fg); --on-surf-var:var(--fg2);
  --outline:var(--line); --outline-var:#3A4D50;
  --bg:var(--s0);
  --danger:var(--err);
  --warn:var(--amber); --ok:var(--mint); --pro:var(--violet); --carb:var(--amber); --fat:var(--pink);
  --card-bg:var(--s2);
  --card-border:transparent;
  --text-primary:var(--fg); --text-secondary:var(--fg2); --text-dim:var(--fg3);
  --divider:var(--line);
  --input-bg:var(--s3);
  --tag-bg:var(--s3);
}
:root[data-theme="light"]{
  color-scheme:light;
  --pri-c:color-mix(in srgb, var(--pri) 20%, #fff); --on-pri-c:color-mix(in srgb, var(--pri) 55%, #000);
  --s0:#F6FAFA; --s1:#FFFFFF; --s2:#EAF1F1; --s3:#DDE7E8; --s4:#CBD8D9;
  --fg:#0C1A1C; --fg2:#3D5154; --fg3:#677B7E; --line:#C5D2D3; --outline-var:#AFC0C1;
  --pink:#B3207D; --pink-c:#FFD8EE; --on-pink-c:#3D0029;
  --amber:#8A5A00; --amber-c:#FFDFA6; --on-amber-c:#2B1A00;
  --violet:#5B3FD0; --violet-c:#E6DEFF; --on-violet-c:#1C0062;
  --mint:#00764A; --mint-c:#B2F5CF; --on-mint-c:#002112;
  --err:#BA1A1A; --err-c:#FFDAD6; --on-err-c:#410002; --on-err:#fff;
  --sky:#1F63B0; --sky-c:#D3E4FF; --on-sky-c:#001C3A; --night:#4B45C2; --night-c:#E3E0FF; --on-night-c:#120E5E; --dock-ic:#fff;
}
/* .light class kept only for any legacy references — now a no-op */
.light{}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:var(--md-sys-color-background);
  color:var(--md-sys-color-on-surface);
  font-family:var(--font-ui);font-optical-sizing:auto;
  font-variant-numeric:tabular-nums;
  min-height:100dvh;overflow-x:clip;
}
/* The page itself scrolls — no inner scroll boxes (they drew black/stale patches on Android WebView) */
#root{min-height:100dvh;display:flex;flex-direction:column;}
.lm-scroller{overflow:visible!important;flex:none!important;min-height:auto!important;}
/* ═══ Material 3 Expressive type system ═══
   Roboto Flex = UI and numbers (tabular figures, no jitter) · Roboto Serif = long-form reading
   15 baseline + 15 emphasized tokens (emphasized: heavier weight, slightly tighter tracking) */
:root{--font-ui:'Roboto Flex','Roboto','Segoe UI',system-ui,sans-serif;
  --font-reading:'Roboto Serif',Georgia,'Times New Roman',serif;
  --font-num:'Roboto Flex','Roboto',system-ui,sans-serif;}
.t-display-large{font-family:var(--font-ui);font-size:57px;line-height:64px;letter-spacing:-0.25px;font-weight:400;}

.t-display-small{font-family:var(--font-ui);font-size:36px;line-height:44px;letter-spacing:0px;font-weight:400;}
.t-headline-large{font-family:var(--font-ui);font-size:32px;line-height:40px;letter-spacing:0px;font-weight:400;}
.t-headline-medium{font-family:var(--font-ui);font-size:28px;line-height:36px;letter-spacing:0px;font-weight:400;}
.t-headline-small{font-family:var(--font-ui);font-size:24px;line-height:32px;letter-spacing:0px;font-weight:400;}
.t-title-large{font-family:var(--font-ui);font-size:22px;line-height:28px;letter-spacing:0px;font-weight:400;}
.t-title-medium{font-family:var(--font-ui);font-size:16px;line-height:24px;letter-spacing:0.15px;font-weight:500;}
.t-title-small{font-family:var(--font-ui);font-size:14px;line-height:20px;letter-spacing:0.1px;font-weight:500;}
.t-body-large{font-family:var(--font-ui);font-size:16px;line-height:24px;letter-spacing:0.5px;font-weight:400;}
.t-body-medium{font-family:var(--font-ui);font-size:14px;line-height:20px;letter-spacing:0.25px;font-weight:400;}
.t-body-small{font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:0.4px;font-weight:400;}
.t-label-large{font-family:var(--font-ui);font-size:14px;line-height:20px;letter-spacing:0.1px;font-weight:500;}
.t-label-medium{font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:0.5px;font-weight:500;}
.t-label-small{font-family:var(--font-ui);font-size:11px;line-height:16px;letter-spacing:0.5px;font-weight:500;}
.t-display-large-em{font-family:var(--font-ui);font-size:57px;line-height:64px;letter-spacing:-0.35px;font-weight:500;}
.t-display-medium-em{font-family:var(--font-ui);font-size:45px;line-height:52px;letter-spacing:-0.1px;font-weight:500;}
.t-display-small-em{font-family:var(--font-ui);font-size:36px;line-height:44px;letter-spacing:-0.1px;font-weight:500;}
.t-headline-large-em{font-family:var(--font-ui);font-size:32px;line-height:40px;letter-spacing:-0.1px;font-weight:500;}
.t-headline-medium-em{font-family:var(--font-ui);font-size:28px;line-height:36px;letter-spacing:-0.1px;font-weight:500;}
.t-headline-small-em{font-family:var(--font-ui);font-size:24px;line-height:32px;letter-spacing:-0.1px;font-weight:500;}
.t-title-large-em{font-family:var(--font-ui);font-size:22px;line-height:28px;letter-spacing:-0.1px;font-weight:500;}
.t-title-medium-em{font-family:var(--font-ui);font-size:16px;line-height:24px;letter-spacing:0.05px;font-weight:700;}
.t-title-small-em{font-family:var(--font-ui);font-size:14px;line-height:20px;letter-spacing:0.0px;font-weight:700;}
.t-body-large-em{font-family:var(--font-ui);font-size:16px;line-height:24px;letter-spacing:0.4px;font-weight:500;}
.t-body-medium-em{font-family:var(--font-ui);font-size:14px;line-height:20px;letter-spacing:0.15px;font-weight:500;}
.t-body-small-em{font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:0.3px;font-weight:500;}
.t-label-large-em{font-family:var(--font-ui);font-size:14px;line-height:20px;letter-spacing:0.0px;font-weight:700;}
.t-label-medium-em{font-family:var(--font-ui);font-size:12px;line-height:16px;letter-spacing:0.4px;font-weight:700;}
.t-label-small-em{font-family:var(--font-ui);font-size:11px;line-height:16px;letter-spacing:0.4px;font-weight:700;}
.t-num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
/* Long-form AI coaching text */
.t-reading{font-family:var(--font-reading);font-size:14px;line-height:22px;letter-spacing:0.1px;font-weight:400;}
.t-reading strong,.t-reading b{font-weight:650;}
::-webkit-scrollbar{width:0;}

/* Material Symbols icon font utility */
.msymbol{
  font-family:'Material Symbols Outlined';
  font-weight:normal;font-style:normal;font-size:24px;
  line-height:1;letter-spacing:normal;text-transform:none;
  display:inline-block;white-space:nowrap;word-wrap:normal;
  direction:ltr;-webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;vertical-align:middle;
}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(32px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(-32px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideOutLeft{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(-32px);}}
@keyframes slideOutRight{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(32px);}}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes barGrow{from{width:0;}}
@keyframes rippleExpand{
  from{transform:translate(-50%,-50%) scale(0);opacity:1;}
  to{transform:translate(-50%,-50%) scale(1);opacity:1;}
}
#theme-ripple{
  position:fixed;z-index:9999;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(0);
  opacity:0;
}

.fade-in{animation:fadeIn 0.25s cubic-bezier(0.2,0,0,1) backwards;}
.ring-arc{transition:stroke-dasharray 0.7s cubic-bezier(0.2,0,0,1), stroke-dashoffset 0.7s cubic-bezier(0.2,0,0,1);}
.bar-fill{animation:barGrow 0.45s cubic-bezier(0.2,0,0,1) both;}
textarea,input,button,select{font-family:inherit;font-variant-numeric:inherit;}

/* ── Capsule nav (reference pattern): wide pill track, inner dark segment for active item ── */
.m3-capsule-nav{
  display:flex;align-items:center;gap:6px;
  background:var(--acc);
  border-radius:999px;
  padding:4px;height:40px;
  transition:max-width 0.3s cubic-bezier(0.2,0,0,1);
  overflow:hidden;max-width:400px;
}
.m3-capsule-nav.hidden{
  max-width:0 !important;
  padding:0;margin:0;gap:0;
}
.m3-capsule-item{
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:32px;border:none;cursor:pointer;background:transparent;
  -webkit-tap-highlight-color:transparent;
  border-radius:999px;
  transition:color 0.25s cubic-bezier(0.2,0,0,1), border-color 0.25s cubic-bezier(0.2,0,0,1), width 0.25s cubic-bezier(0.2,0,0,1), padding 0.25s cubic-bezier(0.2,0,0,1), max-width 0.25s cubic-bezier(0.2,0,0,1), opacity 0.25s cubic-bezier(0.2,0,0,1), transform 0.25s cubic-bezier(0.2,0,0,1);
  flex-shrink:0;color:var(--md-sys-color-on-primary, #00201f);
  font-size:14px;line-height:20px;letter-spacing:0;font-weight:700;white-space:nowrap;
}
.m3-capsule-item.active{
  color:var(--text-primary);
  padding:0 14px;
}
.m3-capsule-item:not(.active){
  padding:0 8px;
}
.m3-capsule-icon{font-size:16px;line-height:1;}
.m3-capsule-detached{
  width:40px;height:40px;border-radius:14px;
  background:var(--md-sys-color-secondary-container);
  color:var(--acc);
  border:none;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  -webkit-tap-highlight-color:transparent;
  transition:transform 0.1s ease;
}
/* Meal-type capsule — same pattern, supports N segments (4 meal types) */
.lm-cv-list > div:nth-child(n+3):not([style*="position: fixed"]){
  content-visibility:auto;contain-intrinsic-size:auto 300px;
}
.m3-meal-capsule{
  display:flex;align-items:center;gap:4px;
  background:var(--acc);
  border-radius:999px;
  padding:4px;height:38px;
  width:fit-content;
}
.m3-meal-item{
  display:flex;align-items:center;justify-content:center;gap:5px;
  height:30px;border:none;cursor:pointer;background:transparent;
  -webkit-tap-highlight-color:transparent;
  border-radius:999px;
  transition:color 0.22s cubic-bezier(0.2,0,0,1), border-color 0.22s cubic-bezier(0.2,0,0,1), width 0.22s cubic-bezier(0.2,0,0,1), padding 0.22s cubic-bezier(0.2,0,0,1), max-width 0.22s cubic-bezier(0.2,0,0,1), opacity 0.22s cubic-bezier(0.2,0,0,1), transform 0.22s cubic-bezier(0.2,0,0,1);
  flex-shrink:0;color:var(--md-sys-color-on-primary, #00201f);
  font-size:14px;line-height:20px;letter-spacing:0.1px;font-weight:600;white-space:nowrap;
}
.m3-meal-item.active{
  color:var(--text-primary);
  padding:0 13px;
}
.m3-meal-item:not(.active){
  padding:0 8px;
}
/* Pill switch animation — all PAINTED properties (no GPU layers):
   the white highlight is an inset shadow that fills in from the edges, the label unrolls via max-width */
.m3-meal-item,.m3-capsule-item{
  box-shadow:inset 0 0 0 0 var(--md-sys-color-surface);
  transition:box-shadow 0.4s cubic-bezier(0.2,0,0,1), padding 0.4s cubic-bezier(0.2,0,0,1), color 0.3s ease !important;
}
.m3-meal-capsule .m3-meal-item.active,.m3-capsule-nav .m3-capsule-item.active{
  box-shadow:inset 0 0 0 24px var(--md-sys-color-surface);
}
.m3-pill-label{
  display:inline-block;max-width:0;overflow:hidden;white-space:nowrap;margin-left:-5px;
  transition:max-width 0.4s cubic-bezier(0.2,0,0,1), margin-left 0.4s cubic-bezier(0.2,0,0,1);
}
.m3-capsule-item .m3-pill-label{margin-left:-6px;}
.active>.m3-pill-label{max-width:110px;margin-left:0;}
.m3-meal-icon{font-size:14px;line-height:1;}
/* One-frame repaint of every visible card after the keyboard opens/closes —
   Android WebView sometimes leaves stale dark patches over inputs inside scrolling areas */
.lm-nudge>*{outline:1px solid transparent;outline-offset:-1px;}
.m3-ripple{position:relative;overflow:hidden;}
.m3-ripple::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle, currentColor 10%, transparent 10.5%);
  opacity:0;transform:scale(8);
  transition:opacity 0.4s ease, transform 0.4s ease;
  pointer-events:none;
}
.m3-ripple:active::after{
  opacity:0.12;transform:scale(0);transition:none;
}
button{
  font-family:var(--font-ui);
  -webkit-tap-highlight-color:transparent;
  /* No transform/opacity/background animation on buttons: Android WebView moves those to GPU layers
     and drew rounded pills as squares (esp. after the keyboard opened). Press = painted shade. */
  transition:border-color 0.18s ease, color 0.18s ease !important;
}
button:active:not(:disabled){
  box-shadow:inset 0 0 0 999px rgba(128,128,128,0.16);
}

.check-btn{
  -webkit-tap-highlight-color:transparent;
  transition:border-color 0.15s ease !important;
}

@keyframes checkPop{
  0%{transform:scale(0.85);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}
.check-pop{animation:checkPop 0.28s cubic-bezier(0.34,1.2,0.64,1) both;}

.hdr-btn{
  -webkit-tap-highlight-color:transparent;
  transition:none !important;
}

/* ── Side nav edge buttons ── */
.sidenav-btn{
  position:fixed;top:50%;transform:translateY(-50%);z-index:50;
  display:flex;flex-direction:column;gap:6px;
  -webkit-tap-highlight-color:transparent;
}
.sidenav-pill{
  writing-mode:vertical-rl;text-orientation:mixed;
  background:var(--md-sys-color-secondary-container);
  border:none;
  border-radius:16px;
  color:var(--md-sys-color-on-surface-variant);
  font-size:11px;font-weight:600;letter-spacing:0.06em;
  padding:14px 5px;cursor:pointer;
  transition:color 0.2s cubic-bezier(0.2,0,0,1), border-color 0.2s cubic-bezier(0.2,0,0,1), width 0.2s cubic-bezier(0.2,0,0,1), padding 0.2s cubic-bezier(0.2,0,0,1), max-width 0.2s cubic-bezier(0.2,0,0,1), opacity 0.2s cubic-bezier(0.2,0,0,1), transform 0.2s cubic-bezier(0.2,0,0,1);
  white-space:nowrap;font-family:var(--font-ui);line-height:1;
}
.sidenav-pill:active{
  background:var(--md-sys-color-primary-container);
  color:var(--md-sys-color-on-primary-container);
  transform:scale(0.95);
}

/* ── Bottom nav (Material 3 NavigationBar style) ── */
.m3-nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  border:none;background:transparent;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;outline:none;
}
.m3-nav-pill{
  display:flex;align-items:center;justify-content:center;gap:5px;
  border-radius:16px;height:32px;padding:0 16px;
  transition:color 0.25s cubic-bezier(0.2,0,0,1), border-color 0.25s cubic-bezier(0.2,0,0,1), width 0.25s cubic-bezier(0.2,0,0,1), padding 0.25s cubic-bezier(0.2,0,0,1), max-width 0.25s cubic-bezier(0.2,0,0,1), opacity 0.25s cubic-bezier(0.2,0,0,1), transform 0.25s cubic-bezier(0.2,0,0,1);
  min-width:56px;
}
.m3-nav-pill.active{background:var(--md-sys-color-secondary-container);}
.m3-nav-icon{font-size:22px;line-height:1;transition:transform 0.25s cubic-bezier(0.34,1.2,0.64,1);}
.m3-nav-item.active .m3-nav-icon{transform:scale(1.05);}
.m3-nav-label{font-size:12px;font-weight:600;letter-spacing:0.01em;transition:color 0.2s;}

/* ── Segmented Buttons (M3 spec): connected outline, pill shape, checkmark on selected ── */
.m3-chip-row{display:flex;gap:8px;padding:10px 16px 2px;flex-shrink:0;overflow-x:auto;justify-content:center;}
.m3-seg-row{display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--md-sys-color-outline);}
.m3-seg{
  flex:1;padding:9px 16px;border:none;border-right:1px solid var(--md-sys-color-outline);
  background:transparent;color:var(--md-sys-color-on-surface-variant);font-size:13px;font-weight:500;
  cursor:pointer;transition:color 0.18s ease;
  -webkit-tap-highlight-color:transparent;outline:none;
  display:flex;align-items:center;justify-content:center;gap:5px;
  position:relative;overflow:hidden;
}
.m3-seg:last-child{border-right:none;}
.m3-seg.active{
  background:var(--md-sys-color-secondary-container);
  color:var(--md-sys-color-on-surface);
  font-weight:600;
}
.m3-seg .seg-check{display:inline-block;width:0;overflow:hidden;transition:width 0.2s ease;}
.m3-seg.active .seg-check{width:14px;}

/* Standalone pill chip — fully rounded (50%), used outside segmented groups */
.m3-chip{
  padding:7px 18px;border-radius:999px;border:1px solid var(--md-sys-color-outline);
  background:transparent;color:var(--md-sys-color-on-surface-variant);font-size:13px;font-weight:500;
  cursor:pointer;transition:color 0.2s cubic-bezier(0.2,0,0,1), border-color 0.2s cubic-bezier(0.2,0,0,1), width 0.2s cubic-bezier(0.2,0,0,1), padding 0.2s cubic-bezier(0.2,0,0,1), max-width 0.2s cubic-bezier(0.2,0,0,1), opacity 0.2s cubic-bezier(0.2,0,0,1), transform 0.2s cubic-bezier(0.2,0,0,1);
  -webkit-tap-highlight-color:transparent;outline:none;
  height:40px;display:inline-flex;align-items:center;gap:5px;
}
.m3-chip.active{
  background:var(--md-sys-color-secondary-container);
  border-color:transparent;
  color:var(--md-sys-color-on-surface);
  font-weight:600;
}

/* ── Big pill toggle switch (Material You quick-settings style) ──
   Track: fully rounded, ~52x30. Thumb: large filled circle that nearly fills track height,
   slides with the track color itself flooding when ON (like the screenshot references). */
.m3-switch{
  position:relative;width:52px;height:30px;border-radius:15px;border:none;cursor:pointer;
  flex-shrink:0;padding:0;-webkit-tap-highlight-color:transparent;
  background:var(--md-sys-color-surface-container-high);
  transition:none;
}
.m3-switch.on{background:var(--acc);}
.m3-switch .m3-switch-thumb{
  position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;
  background:var(--md-sys-color-outline);
  transition:left 0.2s cubic-bezier(0.34,1.2,0.64,1), width 0.15s ease;
  box-shadow:0 1px 2px rgba(0,0,0,0.2);
}
.m3-switch.on .m3-switch-thumb{
  left:25px;background:var(--md-sys-color-on-primary, #ffffff);
  width:24px;
}

/* ── Cards (M3 large-component radius: 28px) ── */
.m3-card{background:var(--md-sys-color-surface-container-low);border-radius:28px;overflow:hidden;margin-bottom:10px;}
.m3-card-outlined{background:var(--md-sys-color-surface-container-low);border-radius:28px;border:1px solid var(--md-sys-color-outline-variant);overflow:hidden;margin-bottom:10px;}

/* ── Inputs (M3 small-component radius: 8px, filled text-field style) ── */
.m3-input{
  width:100%;background:var(--md-sys-color-surface-container-high);
  border:1px solid var(--md-sys-color-outline-variant);
  /* 42px single line → 21px radius = perfect half-circle ends; stays rounded as it grows */
  border-radius:21px;padding:10px 16px;line-height:20px;color:var(--md-sys-color-on-surface);
  font-size:14px;letter-spacing:0.25px;font-weight:400;resize:none;outline:none;
  transition:border-color 0.2s;
}
input.m3-input{border-radius:999px;}
.m3-input:focus{border-color:var(--md-sys-color-primary);border-width:2px;padding:9px 15px;}
/* Slide-in action buttons (Today "+" from the right, History "Add" from the left) */
.lm-slide-right{display:flex;justify-content:flex-end;overflow:hidden;flex-shrink:0;height:42px;
  transition:width 0.22s cubic-bezier(0.2,0,0,1);}
.lm-slide-right>button{margin-left:6px;}
.lm-morph{position:relative;width:42px;height:42px;border-radius:50%;border:none;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  -webkit-tap-highlight-color:transparent;
  background:var(--md-sys-color-surface-variant);color:var(--md-sys-color-on-surface-variant);
  transition:color 0.3s ease;}
.lm-morph.is-send{background:var(--acc);color:var(--md-sys-color-on-primary);}
.lm-morph:active{box-shadow:inset 0 0 0 21px rgba(0,0,0,0.12);}
.lm-send-today{width:20px;height:20px;margin-left:2px;}
.lm-slide-left{display:flex;overflow:hidden;flex-shrink:0;
  transition:max-width 0.3s cubic-bezier(0.2,0,0,1), margin-right 0.3s cubic-bezier(0.2,0,0,1);}
.lm-slide-left>button{transition:transform 0.3s cubic-bezier(0.2,0,0,1), opacity 0.2s ease;white-space:nowrap;}
.m3-input::placeholder{color:var(--md-sys-color-on-surface-variant);}

/* ── Buttons (M3 spec: fully rounded pill shape, 40dp height, 24dp/16dp padding) ── */
.m3-btn{
  background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);
  border:none;border-radius:999px;
  padding:0 24px;height:40px;font-size:14px;line-height:20px;font-weight:700;cursor:pointer;width:100%;
  letter-spacing:0;display:flex;align-items:center;justify-content:center;
}
.m3-btn:disabled{background:var(--md-sys-color-surface-variant);color:var(--md-sys-color-outline);}
.m3-btn-tonal{
  background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-surface);
  border:none;border-radius:999px;
  padding:0 20px;height:40px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.m3-btn-ghost{
  background:transparent;color:var(--md-sys-color-on-surface-variant);
  border:1px solid var(--md-sys-color-outline);
  border-radius:999px;padding:0 18px;height:40px;font-size:13px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}

/* ── Section label ── */
.sec-label{font-size:12px;line-height:16px;font-weight:700;color:var(--md-sys-color-on-surface-variant);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;font-family:'Roboto',sans-serif;}

/* ── List item ── */
.list-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--md-sys-color-outline-variant);}
.list-item:last-child{border-bottom:none;}

/* ═══ Expressive shell ═══ */
.ex-display{font-family:var(--font-ui);font-stretch:125%;font-weight:850;letter-spacing:-.01em;line-height:1.05;}
.ex-eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--fg3);}
.page-head{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}

.dock-add{width:64px;height:64px;border-radius:24px;border:none;display:grid;place-items:center;

.dock-add svg{width:30px;height:30px;fill:currentColor;}

.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--s4);margin:2px auto 14px;}

.sheet-x{width:40px;height:40px;border-radius:20px;border:none;background:var(--s3);color:var(--fg2);font-size:18px;font-weight:700;display:grid;place-items:center;flex:none;}

// AI runs through the Claude API with your own key (see native.js). 'fast' = meal maths, 'smart' = coaching.
async function callAI(prompt,maxTokens=400,kind='smart',json=false){
  const clean=t=>(t||'').replace(/```json|```/g,'').trim();
  const t=clean(await window.LMNative.ask(prompt,maxTokens,kind,json));
  if(!json)return t;
  // pull the JSON out even if the model wrapped it in a sentence; ask once more if there is none
  const pick=s=>{const i=s.search(/[\[{]/);if(i<0)return null;const j=s.lastIndexOf(s[i]==='{'?'}':']');if(j<i)return null;
    const c=s.slice(i,j+1);try{JSON.parse(c);return c;}catch(_){return null;}};
  let c=pick(t);if(c)return c;
  c=pick(clean(await window.LMNative.ask(prompt+'\n\nYour previous reply was not valid JSON. Reply with ONLY the JSON — no words before or after it.',maxTokens,kind,json)));
  if(c)return c;
  throw new Error('The AI didn’t send back macros — tap Calculate macros to try again');
}

function buildSchedule(){
  const sch={};
  for(let i=0;i<365;i++){
    const ds=getDateStr(i),dow=getDOW(ds);
    // 7-day schedule — no rest days
    // Sun=0 Mon=1 Tue=2 Wed=3 Thu=4 Fri=5 Sat=6
    if(dow===0)sch[ds]={type:'full_core',  label:'Full Body + Core',       icon:'🔥'};
    else if(dow===1)sch[ds]={type:'run_easy',  label:'Incline Walk + Cardio',icon:'🏃'};
    else if(dow===2)sch[ds]={type:'upper',     label:'Upper Body Strength',  icon:'💪'};
    else if(dow===3)sch[ds]={type:'run_tempo', label:'Sprint Intervals',     icon:'⚡'};
    else if(dow===4)sch[ds]={type:'lower',     label:'Lower Body Strength',  icon:'🦵'};
    else if(dow===5)sch[ds]={type:'upper',     label:'Upper Body + Arms',    icon:'💪'};
    else             sch[ds]={type:'cardio_core',label:'Cardio + Core',      icon:'🏃'};
  }
  return sch;
}
const SCHEDULE=buildSchedule();

function getDayInfo(ds){
  if(SCHEDULE[ds])return SCHEDULE[ds];
  const dow=getDOW(ds);
  if(dow===0)return{type:'full_core',  label:'Full Body + Core',     icon:'🔥'};
  if(dow===1)return{type:'run_easy',   label:'Incline Walk + Cardio',icon:'🏃'};
  if(dow===2)return{type:'upper',      label:'Upper Body Strength',  icon:'💪'};
  if(dow===3)return{type:'run_tempo',  label:'Sprint Intervals',     icon:'⚡'};
  if(dow===4)return{type:'lower',      label:'Lower Body Strength',  icon:'🦵'};
  if(dow===5)return{type:'upper',      label:'Upper Body + Arms',    icon:'💪'};
  return{type:'cardio_core',label:'Cardio + Core',icon:'🏃'};
}

// ── Diet-adaptive workout type override ──────────────────────────────────────
// Called for today's date with today's logged macros.
// Returns the effective workout type to use (may differ from scheduled).
function getDietAdaptedWorkout(scheduledType, dietMacros, fitLogs, dateStr){
  const cal=dietMacros?.cal||0;
  const pro=dietMacros?.pro||0;
  const carbs=dietMacros?.carbs||0;
  const hasEnoughData=cal>=600; // at least breakfast+lunch logged

  // ── No recent workouts → comeback cardio ─────────────────────────────────
  const recentDates=Array.from({length:5},(_,i)=>{
    const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()-(i+1));return localDate(d);
  });
  const hasRecentWorkout=recentDates.some(d=>fitLogs[d]?._dayComplete);
  if(!hasRecentWorkout&&Object.keys(fitLogs).length>0){
    // Been away — start with cardio regardless of schedule
    return{type:'cardio_core',label:'Comeback Cardio',icon:'🏃',adapted:true,
      reason:'No recent sessions — starting back with cardio to ease in'};
  }

  // ── Not enough diet data yet (user workouts in evening) → use schedule ──
  if(!hasEnoughData){
    return{...getDayInfo(dateStr),adapted:false,
      reason:'Log your meals — workout will adapt to your diet once enough data is in'};
  }

  // ── Diet-driven adaptation ────────────────────────────────────────────────
  const wellFuelled=cal>=1500&&pro>=80;  // good protein + calories
  const highCarb=carbs>=160&&pro<70;      // carb-heavy, low protein
  const lowFuel=cal<700||pro<35;          // underfuelled
  const moderateFuel=cal>=700&&cal<1400&&pro>=50;

  if(lowFuel){
    // Too little food → keep it light, mobility only
    return{type:'cardio_core',label:'Light Session',icon:'🌿',adapted:true,
      reason:`Low intake (${Math.round(cal)} kcal, ${Math.round(pro)} g protein) — lighter session to avoid muscle breakdown`};
  }

  if(highCarb){
    // Lots of carbs, not much protein → burn the glycogen, skip heavy lifting
    if(scheduledType==='lower'||scheduledType==='upper'||scheduledType==='full_core'){
      return{type:'cardio_core',label:'Cardio (Carb Burn)',icon:'🔥',adapted:true,
        reason:`High carbs (${Math.round(carbs)}g), low protein (${Math.round(pro)}g) — cardio burns glycogen better than lifting today`};
    }
  }

  if(wellFuelled){
    // Great intake → stick to schedule, maybe upgrade cardio to tempo
    if(scheduledType==='run_easy'){
      return{type:'run_tempo',label:'Upgrade: Sprint Intervals',icon:'⚡',adapted:true,
        reason:`Well fuelled (${Math.round(cal)} kcal, ${Math.round(pro)} g protein) — energy supports high-intensity intervals today`};
    }
    return{...getDayInfo(dateStr),adapted:true,
      reason:`Well fuelled (${Math.round(pro)}g protein) — stick to the plan and push hard 💪`};
  }

  if(moderateFuel){
    // Moderate — do the schedule but keep intensity moderate
    return{...getDayInfo(dateStr),adapted:false,
      reason:`Moderate intake (${Math.round(cal)} kcal) — follow the plan at comfortable intensity`};
  }

  return{...getDayInfo(dateStr),adapted:false,reason:null};
}

// Muscles covered by each workout type (to avoid suggesting the same muscle group)
const WORKOUT_MUSCLES={
  upper:['arms','shoulders','back','chest'],
  lower:['legs','glutes'],
  full_core:['legs','glutes','core','back','shoulders','chest'],
  run_easy:['cardio'],
  run_tempo:['cardio'],
  cardio_core:['cardio','core'],
  rest:[],
};

// Build smart suggestions — genuinely driven by today's diet macros
function getSmartSuggestions(dayType, scheduledExIds, customActivities, fitLogs, dietMacros){
  const coveredMuscles=new Set(WORKOUT_MUSCLES[dayType]||[]);
  const existingNames=new Set(customActivities.map(a=>(a.name||'').trim().toLowerCase()));
  const allPastCustom=Object.values(fitLogs).flatMap(dl=>dl._custom||[]);
  const pastNames=allPastCustom.map(a=>(a.name||'').toLowerCase());

  const cal=dietMacros?.cal||0;
  const pro=dietMacros?.pro||0;
  const carbs=dietMacros?.carbs||0;

  // ── Determine workout tier based on diet ────────────────────────────────
  // Tier A: Well-fuelled (good cal + good protein) → push hard
  // Tier B: High carb / high cal but low protein → cardio + light strength
  // Tier C: Normal / moderate → balanced
  // Tier D: Underfuelled (<600 kcal or <40g protein) → recovery only

  const tierA = cal>=1500 && pro>=80;           // well fuelled
  const tierB = cal>=1400 && carbs>=160;         // carb-loaded, burn it
  const tierC = cal>=800 && cal<1500 && pro>=50; // moderate
  const tierD = cal<600 || (cal>0 && pro<40);   // underfuelled

  // ── Diet-specific suggestion sets ───────────────────────────────────────
  // Each scenario returns an ordered list of activity names from ACTIVITY_POOL
  let priority=[];

  if(tierD){
    // Underfuelled → recovery only, no heavy work
    priority=['Hip Flexor Stretch','Hamstring Stretch','Cat-Cow + Child\'s Pose','Foam Roll (Full Body)'];
  } else if(tierB && !tierA){
    // High carb, lower protein → burn glycogen with cardio, skip heavy lifting
    priority=['Treadmill Burst Intervals','Incline Treadmill Walk','Stair Climber','Russian Twist','Plank Hold','Hanging Knee Raise'];
  } else if(tierA){
    // Well fuelled → push compound strength + some cardio
    // Suggest muscles NOT already covered by today's scheduled workout
    const strengthPool=[];
    if(!coveredMuscles.has('legs')&&!coveredMuscles.has('glutes'))
      strengthPool.push('Goblet Squat','Walking Lunges','Sumo Squat');
    if(!coveredMuscles.has('arms'))
      strengthPool.push('Dumbbell Bicep Curl','Hammer Curl','Tricep Dips');
    if(!coveredMuscles.has('back'))
      strengthPool.push('Dumbbell Row','Resistance Band Pull-Apart');
    if(!coveredMuscles.has('shoulders'))
      strengthPool.push('Lateral Raise','Face Pull');
    if(!coveredMuscles.has('core'))
      strengthPool.push('Russian Twist','Ab Wheel Rollout','Hanging Knee Raise');
    if(!coveredMuscles.has('cardio'))
      strengthPool.push('Incline Treadmill Walk','Treadmill Burst Intervals');
    priority=[...strengthPool,'Hip Flexor Stretch','Foam Roll (Full Body)'];
  } else {
    // Tier C — moderate fuel → balanced cardio + core + one strength
    priority=[];
    if(!coveredMuscles.has('cardio'))
      priority.push('Brisk Treadmill Walk','Incline Treadmill Walk');
    if(!coveredMuscles.has('core'))
      priority.push('Plank Hold','Russian Twist');
    if(!coveredMuscles.has('arms'))
      priority.push('Dumbbell Bicep Curl','Tricep Dips');
    priority.push('Hip Flexor Stretch','Hamstring Stretch');
  }

  // ── On rest days, also consider adding cardio regardless of tier ─────────
  if(dayType==='rest'){
    if(tierA) priority=['Treadmill Burst Intervals','Stair Climber','Incline Treadmill Walk','Goblet Squat','Russian Twist','Dumbbell Row','Hip Flexor Stretch','Foam Roll (Full Body)'];
    else if(tierB) priority=['Treadmill Burst Intervals','Incline Treadmill Walk','Stair Climber','Plank Hold','Russian Twist','Hip Flexor Stretch','Foam Roll (Full Body)'];
    else if(tierD) priority=['Hip Flexor Stretch','Hamstring Stretch','Cat-Cow + Child\'s Pose','Foam Roll (Full Body)','Brisk Treadmill Walk'];
    else priority=['Brisk Treadmill Walk','Incline Treadmill Walk','Plank Hold','Hip Flexor Stretch','Hamstring Stretch','Foam Roll (Full Body)','Russian Twist'];
  }

  // ── Map priority names to pool entries, filter already-added ───────────
  const poolByName=Object.fromEntries(ACTIVITY_POOL.map(a=>[a.name,a]));
  const result=[];
  const seen=new Set();

  for(const name of priority){
    if(seen.has(name)) continue;
    seen.add(name);
    const item=poolByName[name];
    if(!item) continue;
    if(existingNames.has(name.toLowerCase())) continue;
    result.push(item);
    if(result.length>=8) break;
  }

  // ── Fill remaining slots from pool if <4 suggestions ───────────────────
  if(result.length<4){
    for(const item of ACTIVITY_POOL){
      if(result.length>=6) break;
      if(existingNames.has(item.name.toLowerCase())) continue;
      if(result.some(r=>r.name===item.name)) continue;
      const muscleOverlap=item.muscles.some(m=>coveredMuscles.has(m));
      if(muscleOverlap&&dayType!=='rest') continue;
      result.push(item);
    }
  }

  return result;
}

        note:'No swinging — core does the work',
        phaseNote:wt('Week 1–4: Knees to waist level','Week 5–8: Knees to chest','Week 9–12: Straight leg raises if able')},
      {id:'f7',name:'Russian Twist',sets:3,reps:'20 total',unit:'reps',
        note:'Feet off floor, touch each side',
        sugKg:wt('Bodyweight','4–6 kg plate','6–10 kg plate'),
        phaseNote:wt('Week 1–4: No weight, feet down if needed','Week 5–8: Add plate, feet elevated','Week 9–12: Heavy plate, controlled rotation')},
    ]},
    rest:{warmup:'',cooldown:'',exercises:[]}
  };
  const workout=WK[type]||WK.rest;
  if(rawPhase===0&&!isVeryFirstDayBack&&workout.exercises&&workout.exercises.length>0){
    // Comeback week 1, after day 1: trim one set off anything with 3+ sets, for extra safety
    workout.exercises=workout.exercises.map(ex=>({
      ...ex,
      sets:typeof ex.sets==='number'&&ex.sets>=3?ex.sets-1:ex.sets,
    }));
    // Insert a treadmill warm-up before lifting — body's still reactivating
    if(['upper','lower','full_core'].includes(type)){
      workout.exercises=[
        {id:'wu_treadmill',name:'Treadmill Walk (incline)',sets:1,reps:'8-10 min',unit:'min',
          note:'Light incline (2-4%), brisk pace — get blood flowing before lifting cold muscles'},
        ...workout.exercises,
      ];
      workout.warmup='8-10 min incline treadmill walk (see first exercise below) + light dynamic stretches';
    }
  }
  if(comebackNote)workout.comebackNote=comebackNote;
  return workout;
}

function calcCal(exId,sets,reps){
  const MET={c1:5,c2:3.5,c3:3,c4:3,c5:3.5,c6:3,r1:7,t1:7,t2:9.5,t3:7,u1:5,u2:4.5,u3:4.5,u4:4,u5:3.5,u6:3.5,u7:3.5,l1:6,l2:5.5,l3:5,l4:5,l5:4.5,l6:3.5,f1:6.5,f2:4.5,f3:4.5,f4:5.5,f5:3.5,f6:3.5,f7:3.5};
  const met=MET[exId]||4,ns=parseInt(sets)||3,nr=(typeof reps==='string'?parseInt(reps)||12:reps)||12;
  const mins=(ns*nr*3/60)+((ns-1)*1.5);
  const kcal=Math.round(met*80*mins/60);
  return{kcal,fat:(kcal/9*0.75).toFixed(1)};
}

  // Copy text: modern clipboard API first, then the older execCommand fallback
  function legacyCopy(t){
    try{
      const ta=document.createElement('textarea');
      ta.value=t;ta.setAttribute('readonly','');
      ta.style.position='fixed';ta.style.opacity='0';ta.style.top='0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(_){return false;}
  }
  async function copyText(t){
    try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(t);return true;}}catch(_){}
    return legacyCopy(t);
  }
  async function exportAll(){
    const ok=await copyText(buildExport());
    if(ok){setShowExportText(false);showToast('✓ Copied to clipboard','var(--ok)');}
    else{setShowExportText(true);showToast('Copy blocked here — select the text below','var(--warn)');}
  }

    try{

      if(!t||!t.trim()){showToast('Clipboard is empty','var(--warn)');return;}
      setImportDietText(t);
      importFromPaste(t);
    }catch(_){
      setClipReadOK(false);

  function importFromPaste(override){

    if(!raw)return;
    let data;
    try{data=JSON.parse(raw);}catch(e){showToast('⚠ Not valid JSON — copy the whole export','var(--danger)');return;}

    let diet=null,fit=null,weight=null,syms=null,body=null,walks=null,sleeps=null,waters=null;
    if(Array.isArray(data)){diet=data;}                          // old diet tracker export
    else if(data&&typeof data==='object'){
      diet=data.dietEntries||null;                               // combined export
      fit=data.fitLogs||data.logs||null;                         // combined / old fitness export
      weight=data.weightLog||null;
      syms=data.symptomLog||null;
      body=data.bodyMeasure||null;
      walks=data.walkLog||null;
      sleeps=data.sleepLog||null;
      waters=data.waterLog||null;
    }
    if(walks){const nd=Object.keys(walks).filter(k=>!walkLog[k]);if(nd.length)setWalkLog(p=>({...walks,...p}));}
    if(sleeps&&typeof sleeps==='object')setSleepLog(p=>({...sleeps,...p}));
    if(waters&&typeof waters==='object')setWaterLog(p=>({...waters,...p}));
    if(!diet&&!fit&&!weight&&!syms&&!body&&!walks&&!sleeps&&!waters){showToast('⚠ Unrecognised format','var(--danger)');return;}

    const parts=[];
    if(diet){
      const ids=new Set(dietEntries.map(x=>x.id));
      const added=diet.filter(x=>x&&!ids.has(x.id));
      if(added.length){
        setDietEntries(p=>[...p,...added].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)));
        parts.push(added.length+' meals');
      }
    }
    if(fit){
      const newDays=Object.keys(fit).filter(k=>!fitLogs[k]);
      if(newDays.length){setFitLogs(p=>({...fit,...p}));parts.push(newDays.length+' workout days');}
    }
    if(weight){
      const newW=Object.keys(weight).filter(k=>weightLog[k]==null);
      if(newW.length){setWeightLog(p=>({...weight,...p}));parts.push(newW.length+' weigh-ins');}

    if(syms){

      if(newS.length){setSymptomLog(p=>{const o={...p};newS.forEach(k=>{o[k]=syms[k];});return o;});parts.push(newS.length+' feeling days');}
    }
    // Body measurements: only fill in if this app still has the untouched defaults
    if(body&&JSON.stringify(bodyMeasure)===JSON.stringify(DEFAULT_BODY)){
      setBodyMeasure(body);setBodySaved(true);parts.push('body measurements');
    }
    showToast(parts.length?'✓ Imported '+parts.join(', '):'✓ Already up to date — nothing new','var(--ok)');

        const gps=mv.walks.filter(w=>w.src==='gps').sort((a,b)=>b.km-a.km)[0];
        const prev=sleepLog[yd],prevMin=sleepMin(prev);

        else if(lateDin&&(ldH>=22||ldH<4)){hi=`Dinner was late last night (${fmtTime(lateDin)}).`;q='Did it get in the way of your sleep?';}
        else if(gps&&gps.km>=2)hi=`That ${gps.km.toFixed(1)} km ${gps.name.toLowerCase()} yesterday was great 🗺️`;
        else if(mv.steps>=WALK_GOAL.day)hi=`${fmtN(mv.steps)} steps yesterday 👟 Your legs earned a good night.`;
        else if(prevMin&&prevMin<6*60)hi=`Hope it was better than the ${fmtHM(prevMin)} the night before.`;
        else if(mv.src==='hc'&&mv.steps>0&&mv.steps<WALK_GOAL.day*0.4&&yd<TODAY)hi=`Quiet day yesterday (${fmtN(mv.steps)} steps). Today's a fresh start.`;

  function planLogItems(){
    if(!logCfg.on)return [];
    const U=usualTimes(),now=Date.now(),out=[];
    for(const day of [TODAY,calAddDays(TODAY,1)]){
      const ms=m=>new Date(day+'T00:00:00').getTime()+m*60000,we=isWeekend(day);
      if(logCfg.sleep&&!sleepMin(sleepLog[day])){const at=ms(Math.min(11*60,Math.max(6*60,(we?U.sleep.we:U.sleep.wd)+30)));
        if(at>now+60000)out.push({at,kind:'sleep',day,...logMessage('sleep',day,at)});}
      const logged=new Set((dietGrouped[day]||[]).map(e=>e.mealType));
      MEAL_TYPES.forEach((mt,i)=>{if(!logCfg[mt])return;
        if(MEAL_TYPES.slice(i).some(x=>logged.has(x)))return;   // this meal, or a later one, is already in
        const at=ms(Math.min(23*60,Math.max(6*60,(we?U[mt].we:U[mt].wd)+(mt==='Snack'?Math.max(60,+logCfg.after):+logCfg.after))));
        if(at>now+60000)out.push({at,kind:mt,day,...logMessage(mt,day,at)});});
    }
    return out.sort((a,b)=>a.at-b.at);
  }

  function renderFitHistory(){
    const cv=pillPreview?.calView||calView;
    const nav=dir=>setCalAnchor(a=>cv==='day'?calAddDays(a,dir):cv==='week'?calAddDays(a,7*dir):cv==='year'?calAddMonths(a,12*dir):calAddMonths(a,dir));
    let days=[],label='';
    if(cv==='day'){days=[calAnchor];label=dateLong(calAnchor);}
    else if(cv==='week'){const ws=calStartOfWeek(calAnchor);days=Array.from({length:7},(_,i)=>calAddDays(ws,i));
      label=`${new Date(days[0]+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})} – ${new Date(days[6]+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}`;}
    else if(cv==='year'){const y=calAnchor.slice(0,4);for(let d=y+'-01-01';d.startsWith(y);d=calAddDays(d,1))days.push(d);label=y;}
    else{const ms=calStartOfMonth(calAnchor);days=Array.from({length:calDaysInMonth(calAnchor)},(_,i)=>calAddDays(ms,i));
      label=new Date(calAnchor+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
    const doneOf=d=>!!fitLogs[d]?._dayComplete;
    const stepsOf=d=>moveDay(d).steps;
    const sess=days.filter(doneOf);
    const planned=days.filter(d=>getDayInfo(d)?.type!=='rest'&&d<=TODAY&&d>=PLAN_START).length;
    const wts=days.filter(d=>weightLog[d]).map(d=>parseFloat(weightLog[d]));
    const sd=days.filter(d=>stepsOf(d)>0);const stepSum=sd.reduce((a,d)=>a+stepsOf(d),0);
    const hit=sd.filter(d=>stepsOf(d)>=WALK_GOAL.day).length;
    const km=days.reduce((a,d)=>a+moveDay(d).km,0);
    const gymK=sess.reduce((a,d)=>a+({upper:280,lower:320,full_core:350,run_easy:220,run_tempo:280,cardio_core:250}[getDayInfo(d)?.type]||250),0);
    const walkK=days.reduce((a,d)=>a+moveDay(d).kcal,0);   // walks + everyday steps
    const goDay=d=>{setSelectedDate(d);setFitView('day');setNoteText((fitLogs[d]?._note)||'');};
    const k=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':String(n);
    const stats=(
      <div className="x-grid2">
        <div className="x-stat"><small>Workouts</small><b style={{color:'var(--mint)'}}>{sess.length}</b><i>of {planned} planned</i></div>
        <div className="x-stat"><small>Steps</small><b style={{color:'var(--pri)'}}>{k(stepSum)}</b><i>{sd.length?`avg ${fmtN(stepSum/sd.length)} · ${hit} day${hit===1?'':'s'} ≥ goal`:'none logged'}</i></div>
        <div className="x-stat"><small>Walked</small><b style={{color:'var(--mint)'}}>{km.toFixed(1)} km</b><i>{days.reduce((a,d)=>a+moveDay(d).walkMin,0)} min of walks</i></div>
        <div className="x-stat"><small>Burned</small><b style={{color:'var(--amber)'}}>{gymK+walkK?'~'+k(gymK+walkK):'—'}</b><i>gym + steps</i></div>
        {wts.length>0&&<div className="x-stat" style={{gridColumn:'1 / -1'}}><small>Weight</small><b style={{color:'var(--violet)'}}>{(wts.reduce((a,b)=>a+b,0)/wts.length).toFixed(1)} kg</b>
          <i>{wts.length>1?`${wts[wts.length-1]-wts[0]>0?'+':''}${(wts[wts.length-1]-wts[0]).toFixed(1)} kg over the period`:'1 weigh-in'}</i></div>}
      </div>);
    return(
      <div className="x-wrap">
        <Seg items={[['day','Day'],['week','Week'],['month','Month'],['year','Year']]} value={cv} onChange={setCalView}/>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button className="x-ibtn" aria-label="Earlier" onClick={()=>nav(-1)}><Ico d={ICON.left} size={24}/></button>
          <div className="x-h2" style={{flex:1,textAlign:'center',fontSize:18}}>{label}</div>
          <button className="x-ibtn" aria-label="Later" onClick={()=>nav(1)}><Ico d={ICON.right} size={24}/></button>
        </div>

        {cv==='day'&&(()=>{const d=calAnchor;const info=getDayInfo(d);const [ac,cont,onc]=tone(info?.type);const w=walkLog[d]||{};const note=fitLogs[d]?._note;
          return(<>
            <div className="x-card sa" style={{background:cont,color:onc,display:'flex',gap:14,alignItems:'center'}}>
              <Shape kind="cookie6" size={60} fill={ac} color="#000" font={28}>{info?.icon||'🌿'}</Shape>
              <div style={{flex:1}}><div className="x-num" style={{fontSize:22,color:'var(--fg)'}}>{info?.label||'Rest day'}</div>
                <div style={{fontWeight:700,marginTop:4}}>{doneOf(d)?'✓ Completed':info?.type==='rest'?'Rest & recover':d===TODAY?'Not done yet':d>TODAY?'Upcoming':'Missed'}</div></div>
            </div>
            {stats}
            {moveDay(d).walks.length>0&&<div style={{display:'flex',flexDirection:'column',gap:10}}>{moveDay(d).walks.map(w=>renderWalkRow(d,w))}</div>}
            {note&&<div className="x-card" style={{fontStyle:'italic',color:'var(--fg2)'}}>“{note}”</div>}
            <button className="x-btn wide tonal" onClick={()=>goDay(d)}>Open this day</button>
          </>);})()}

        {cv==='week'&&<>
          <div className="x-grid" style={{display:'grid',gridTemplateColumns:'repeat(7,minmax(0,1fr))',gap:4}}>
            {days.map(d=>{const info=getDayInfo(d);const [ac]=tone(info?.type);const dn=doneOf(d);const st=stepsOf(d);const dt=new Date(d+'T00:00:00');
              return(<button key={d} onClick={()=>goDay(d)} style={{border:'none',background:d===TODAY?'var(--s2)':'transparent',borderRadius:18,padding:'8px 0',display:'flex',flexDirection:'column',alignItems:'center',gap:5,color:'var(--fg2)',opacity:d>TODAY?.4:1}}>
                <small style={{fontWeight:750,fontSize:11}}>{dt.toLocaleDateString('en-IN',{weekday:'narrow'})}</small>
                <Shape kind={dn?'cookie9':'cookie12'} size={38} fill={dn?ac:'var(--s3)'} color={dn?'#000':'var(--fg)'} font={15}><b>{dt.getDate()}</b></Shape>
                <span style={{fontSize:16,lineHeight:1}}>{info?.icon||'🌿'}</span>
                <small style={{fontSize:10,fontWeight:800,color:st>=WALK_GOAL.day?'var(--mint)':'var(--fg3)'}}>{st?k(st):'·'}</small>
              </button>);})}
          </div>
          {stats}
          {stepSum>0&&<div className="x-card" style={{display:'flex',flexDirection:'column',gap:10}}>
            <div className="x-eyebrow">Daily steps</div>
            {days.map(d=>{const st=stepsOf(d);return(<div key={d} style={{display:'grid',gridTemplateColumns:'36px 1fr 52px',gap:8,alignItems:'center'}}>
              <small style={{fontWeight:750,color:d===TODAY?'var(--pri)':'var(--fg2)'}}>{new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'})}</small>
              <WavyBar value={st} max={Math.max(WALK_GOAL.day,...days.map(stepsOf))} color={st>=WALK_GOAL.day?'var(--mint)':'var(--pri)'} h={12}/>
              <small style={{textAlign:'right',fontWeight:750,fontVariantNumeric:'tabular-nums'}}>{st?fmtN(st):'—'}</small></div>);})}
          </div>}
          {sess.length>0&&<div className="x-list">{sess.map(d=>{const info=getDayInfo(d);const [ac,cont]=tone(info?.type);
            return <button key={d} className="x-item" onClick={()=>goDay(d)}><Shape kind="cookie6" size={40} fill={cont} font={18}>{info?.icon}</Shape>
              <span style={{flex:1}}><span className="t" style={{display:'block'}}>{info?.label}</span><span className="s">{dateNice(d)}{weightLog[d]?` · ${weightLog[d]} kg`:''}</span></span><span style={{color:'var(--mint)',fontWeight:900}}>✓</span></button>;})}</div>}
        </>}

        {cv==='month'&&<>
          <div className="x-card" style={{padding:'14px 10px'}}>
            <div className="x-cal" style={{marginBottom:4}}>{['M','T','W','T','F','S','S'].map((d,i)=><div key={i} style={{aspectRatio:'auto',fontSize:11,color:'var(--fg3)'}}>{d}</div>)}</div>
            <div className="x-cal">
              {Array.from({length:(new Date(days[0]+'T00:00:00').getDay()+6)%7},(_,i)=><div key={'p'+i}/>)}
              {days.map(d=>{const info=getDayInfo(d);const [ac]=tone(info?.type);const dn=doneOf(d);const st=stepsOf(d);const dt=new Date(d+'T00:00:00');
                return(<button key={d} onClick={()=>goDay(d)} aria-label={dateNice(d)} style={{opacity:d>TODAY?.35:1,color:dn?'#000':d===TODAY?'var(--pri)':'var(--fg2)'}}>
                  {dn?<Shape kind="cookie9" size={38} fill={ac} color="#000" font={14} style={{position:'absolute'}}><b>{dt.getDate()}</b></Shape>
                    :<span style={{width:36,height:36,borderRadius:18,display:'grid',placeItems:'center',boxShadow:st>=WALK_GOAL.day?'inset 0 0 0 2.5px var(--mint)':d===TODAY?'inset 0 0 0 2px var(--pri)':'none'}}>{dt.getDate()}</span>}
                </button>);})}
            </div>
            <div className="x-chips" style={{marginTop:12,justifyContent:'center'}}>
              <span className="x-tag"><Shape kind="cookie9" size={14} fill="var(--mint)"/> workout</span>
              <span className="x-tag"><span style={{width:12,height:12,borderRadius:6,boxShadow:'inset 0 0 0 2px var(--mint)'}}/> step goal</span>
            </div>
          </div>
          {stats}
        </>}

        {cv==='year'&&(()=>{const y=calAnchor.slice(0,4);
          const months=Array.from({length:12},(_,i)=>{const mk=`${y}-${String(i+1).padStart(2,'0')}`;const md=days.filter(d=>d.startsWith(mk));const s=md.filter(d=>stepsOf(d)>0);
            return {mk,steps:s.reduce((a,d)=>a+stepsOf(d),0),avg:s.length?s.reduce((a,d)=>a+stepsOf(d),0)/s.length:0,km:md.reduce((a,d)=>a+moveDay(d).km,0),gym:md.filter(doneOf).length};});
          const mx=Math.max(1,...months.map(m=>m.steps));
          return(<>{stats}
            <div className="x-list">{months.filter(m=>m.mk<=TODAY.slice(0,7)).reverse().map(m=>{const empty=!m.steps&&!m.gym;return(
              <button key={m.mk} className="x-item" disabled={empty} style={{opacity:empty?.4:1,flexDirection:'column',alignItems:'stretch',gap:8}} onClick={()=>{setCalAnchor(m.mk+'-01');setCalView('month');}}>
                <span style={{display:'flex',alignItems:'baseline',gap:10}}><span className="t" style={{width:40}}>{new Date(m.mk+'-01T00:00:00').toLocaleDateString('en-IN',{month:'short'})}</span>

                {m.steps>0&&<WavyBar value={m.steps} max={mx} color="var(--pri)" h={10}/>}
              </button>);})}</div></>);})()}
      </div>);
  }

    const proS=ser(d=>dietGrouped[d]?.length?rnd(macrosOf(d).pro):null);

  function feelCard(e,date,open){
    const sx=SYMPTOMS.find(x=>x.id===e.id);if(!sx)return null;
    const times=Array.isArray(e.timeOfDay)?e.timeOfDay:(e.timeOfDay?[e.timeOfDay]:[]);
    const count=e.count||1;
    const patch=f=>patchSymptom(date,e.id,f);
    const area=Array.isArray(e.area)?e.area:[];
    const ageH=e.since?(Date.now()-e.since)/3600000:0;
    const flagPain=e.id==='pain'&&(e.level==='severe'||area.includes('lr')||ageH>72);
    const flagFever=e.id==='fever'&&((e.temp&&e.temp>=102)||ageH>72||e.level==='severe');
    const lab=t=><div className="x-eyebrow" style={{margin:'14px 0 8px'}}>{t}</div>;
    return(
      <div key={e.id} className="x-card" style={{background:'var(--s2)',marginTop:8,padding:open?'14px 16px 16px':'10px 14px'}}>
        <button onClick={()=>setDraft(d=>({...d,open:open?null:e.id}))} style={{display:'flex',alignItems:'center',gap:12,width:'100%',border:'none',background:'transparent',color:'var(--fg)',textAlign:'left',padding:0}}>
          <Shape kind="flower" size={40} fill={sx.id==='good'?'var(--mint-c)':'var(--pink-c)'} font={20}>{sx.emoji}</Shape>
          <span style={{flex:1,minWidth:0}}><b style={{display:'block'}}>{sx.label}</b><span className="x-sub" style={{fontSize:12}}>{symptomText(e,date).replace(sx.label,'').trim()||'Tap to add details'}</span></span>
          <span style={{color:'var(--fg3)',fontSize:18}}>{open?'▴':'▾'}</span>
        </button>
        {open&&<>
          {COUNT_IDS.includes(e.id)&&<>{lab('How many times')}
            <div className="x-step"><button onClick={()=>logSymptomForDate(e.id,date,Math.max(1,count-1),times)}>−</button><b className="x-num" style={{fontSize:24}}>{count}</b><button onClick={()=>logSymptomForDate(e.id,date,count+1,times)}>+</button></div></>}
          {e.id==='fever'&&<>{lab('Temperature (optional)')}
            <div style={{display:'flex',gap:10,alignItems:'center'}}>
              <input type="text" inputMode="decimal" className="x-field" placeholder="e.g. 99.5" value={e.temp??''} style={{width:130}}
                onChange={ev=>{const v=parseFloat(ev.target.value.replace(',','.'));patch({temp:isNaN(v)?null:v});}}/>
              <b>°F</b>{e.temp?<span className={`x-chip ${e.temp>=100.4?'err':'mint'}`}>{e.temp>=100.4?'Fever':'No fever'}</span>:null}
            </div></>}
          {(DETAIL_IDS.includes(e.id)||e.id==='pain')&&<>{lab('How bad')}
            <div className="x-chips">{PAIN_LEVELS.map(l=><button key={l.id} className={`x-chip${e.level===l.id?' on':''}`} onClick={()=>patch({level:e.level===l.id?null:l.id})}>{l.label}</button>)}</div>
            {lab('Started')}
            <div className="x-chips">{PAIN_SINCE.map(o=><button key={o.id} className={`x-chip${e.sinceOpt===o.id?' on':''}`} onClick={()=>patch(e.sinceOpt===o.id?{since:null,sinceOpt:null,relMeal:null}:{since:o.at(),sinceOpt:o.id,relMeal:null})}>{o.label}</button>)}</div>
            <input type="datetime-local" className="x-field" style={{marginTop:8,fontSize:15}} value={e.since?toLocalInput(e.since):''} max={toLocalInput(Date.now())}
              onChange={ev=>{const v=ev.target.value;patch(v?{since:new Date(v).getTime(),sinceOpt:'exact',relMeal:null}:{since:null,sinceOpt:null,relMeal:null});}}/>
            {e.since&&<div className="x-sub" style={{marginTop:6}}>{e.relMeal?`Started ${e.relMeal.rel} ${e.relMeal.food} · `:''}{fmtSince(e.since,date)} · about {sinceDuration(e.since)}</div>}
          </>}
          {e.id==='pain'&&<>
            {lab('Where — as you look down at your belly')}
            <div className="x-belly">
              {BELLY_AREAS.map(b=><button key={b.id} className={area.includes(b.id)?'on':''} onClick={()=>patch({area:area.includes(b.id)?area.filter(x=>x!==b.id):[...area,b.id]})}>{b.short}{b.id==='mm'?' •':''}</button>)}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,fontWeight:700,color:'var(--fg3)',margin:'4px 8px 0'}}><span>◀ your left</span><span>your right ▶</span></div>
            {BELLY_AREAS.filter(b=>area.includes(b.id)).map(b=><div key={b.id} className="x-sub" style={{marginTop:8}}><b style={{color:'var(--fg)'}}>{b.label}:</b> {b.hint}</div>)}
            {(dietGrouped[date]||[]).length>0&&<>{lab('…or pin it to a meal')}
              <div className="x-list">{sortByMealTime(dietGrouped[date]).map(m=>{const {ts,approx}=mealTime(m);const rel=e.relMeal?.id===m.id?e.relMeal.rel:null;
                const pin=r=>patch(rel===r?{relMeal:null,sinceOpt:null}:{relMeal:{id:m.id,rel:r,food:m.food},since:ts+(r==='after'?60000:-60000),sinceOpt:r});
                return(<div key={m.id} className="x-item" style={{background:'var(--s3)',minHeight:52,padding:'8px 10px'}}>
                  <span style={{fontSize:20}}>{m.emoji||'🍽️'}</span>
                  <span style={{flex:1,minWidth:0}}><span className="t" style={{display:'block',fontSize:13.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.food}</span><span className="s">{m.mealType} · {fmtTime(ts)}{approx?' ~':''}</span></span>
                  <button className={`x-chip${rel==='before'?' on':''}`} onClick={()=>pin('before')}>Before</button>
                  <button className={`x-chip${rel==='after'?' on':''}`} onClick={()=>pin('after')}>After</button>
                </div>);})}</div></>}
          </>}
          {lab('When')}
          <div className="x-chips">{TIME_OF_DAY.map(t=>{const on=times.includes(t.id);return <button key={t.id} className={`x-chip${on?' on':''}`} onClick={()=>logSymptomForDate(e.id,date,count,on?times.filter(x=>x!==t.id):[...times,t.id])}>{t.emoji} {t.label}</button>;})}</div>
          {(flagPain||flagFever)&&<div className="x-card err" style={{marginTop:14,borderRadius:18,padding:'12px 14px',fontSize:13,lineHeight:1.5}}>
            <b>See a doctor soon</b> {flagPain?'if the pain is severe or getting worse, lasts more than 2–3 days, is in the lower right with fever or vomiting, or comes with blood. Upper-middle pain with chest pressure, sweating or breathlessness needs emergency care.':'if the fever is 102 °F or higher, lasts more than 3 days, or comes with a severe headache, stiff neck, rash, breathing trouble, or you can’t keep fluids down.'}</div>}
          <button className="x-btn ghost" style={{marginTop:10,color:'var(--err)'}} onClick={()=>{logSymptomForDate(e.id,date,0);setDraft(d=>({...d,open:null}));}}>Remove {sx.label.toLowerCase()}</button>
        </>}
      </div>);
  }

  /* ═══════════════════════════════════════════════════════════════
     FIRST-TIME SETUP · categorised SETTINGS · HEALTH CONNECT
  ═══════════════════════════════════════════════════════════════ */
  // Suggested daily targets from profile + body (Mifflin–St Jeor)
  function suggestTargets(d){
    const w=+d.weightKg,h=+d.heightCm,a=+d.age||30;
    const out={steps:+d.steps||10000,water:w?Math.round(w*35/250)*250:3000};
    if(!(w>0&&h>0))return{...out,calMin:1700,calMax:1850,protein:100};
    const bmr=10*w+6.25*h-5*a+(d.gender==='female'?-161:d.gender==='male'?5:-78);
    const tdee=bmr*({sitting:1.2,light:1.375,active:1.55}[d.activity]||1.375);
    const target=d.goal==='lose'?tdee-Math.min(500,tdee*0.2):d.goal==='gain'?tdee+250:tdee;
    const r50=x=>Math.round(x/50)*50;
    const prot=Math.round(w*({lose:1.6,gain:1.8,maintain:1.4}[d.goal]||1.6)/5)*5;
    return{...out,calMin:r50(target-75),calMax:r50(target+75),protein:Math.min(prot,220)};
  }
  const SETUP_PAGES=['welcome','you','body','shape','goal','targets','ai','phone','done'];
  function startSetup(page){

  const hcBusy=useRef(false);

      // 1. Steps from the phone → "phone steps" for the last 7 days

            if(x.steps>0&&(!cur.dayTotal||cur.dayTotalSrc==='hc')&&String(cur.dayTotal)!==String(x.steps)){
              if(!ch){n={...p};ch=true;}n[x.date]={...cur,dayTotal:String(x.steps),dayTotalSrc:'hc'};}}
          return n;});
      }
      // 2. Our logs → Health Connect (only what changed since last time)
      const can=t=>g.write.includes(t);
      const since=calAddDays(TODAY,-30),recs=[];
      if(hcT.meals&&can('Nutrition'))dietEntries.forEach(e=>{const day=localDate(new Date(e.timestamp));if(day<since)return;const m=entryMacros(e);if(!(m.cal>0))return;
        const {ts}=mealTime(e);recs.push({type:'Nutrition',id:'meal-'+e.id,start:ts,end:ts+60000,name:e.food,mealType:e.mealType,kcal:Math.round(m.cal),protein:+m.pro.toFixed(1),carbs:+m.carbs.toFixed(1),fat:+m.fat.toFixed(1)});});
      if(hcT.water&&can('Hydration'))Object.entries(waterLog).forEach(([dk,ws])=>{if(dk<since)return;(ws||[]).forEach(x=>recs.push({type:'Hydration',id:'water-'+x.ts,start:x.ts,end:x.ts+60000,ml:+x.ml}));});
      if(hcT.workouts&&can('ExerciseSession')){
        Object.entries(walkLog).forEach(([dk,w])=>{if(dk<since||!w)return;WALK_SLOTS.forEach(sl=>{const x=w[sl.id];if(!x||!x.from||!x.to)return;

// ── Markdown renderer — bold, italic, underline, numbered sections, line breaks ──
function renderMD(text){
  if(!text) return null;
  // Split on double newline for paragraphs, single newline for line breaks
  const blocks=text.split(/\n{2,}/);
  return blocks.map((block,bi)=>{
    const lines=block.split('\n');
    return(
      <div key={bi} style={{marginBottom:bi<blocks.length-1?10:0}}>
        {lines.map((line,li)=>{
          if(!line.trim()) return null;
          // Parse inline: **bold**, *italic*, __underline__, numbered 1. 2. 3.
          const isHeading=/^\*\*[A-Z\s]+:?\*\*/.test(line.trim())||/^(1\.|2\.|3\.)/.test(line.trim());
          const parts=[];
          const bullet=/^\s*[-*•]\s+/.test(line);
          let rest=bullet?line.replace(/^\s*[-*•]\s+/,''):line;
          let key=0;
          // Process inline tokens
          while(rest.length){
            // **bold**
            const b=rest.match(/^([\s\S]*?)\*\*([\s\S]+?)\*\*/);
            if(b){
              if(b[1]) parts.push(<span key={key++}>{b[1]}</span>);
              parts.push(<strong key={key++} style={{fontWeight:800,color:'inherit'}}>{b[2]}</strong>);
              rest=rest.slice(b[0].length);
              continue;
            }
            // *italic* (not **)
            const it=rest.match(/^([\s\S]*?)\*([^*\n]+?)\*/);
            if(it){
              if(it[1]) parts.push(<span key={key++}>{it[1]}</span>);
              parts.push(<em key={key++} style={{fontStyle:'italic'}}>{it[2]}</em>);
              rest=rest.slice(it[0].length);
              continue;
            }
            // __underline__
            const ul=rest.match(/^([\s\S]*?)__([\s\S]+?)__/);
            if(ul){
              if(ul[1]) parts.push(<span key={key++}>{ul[1]}</span>);
              parts.push(<span key={key++} style={{textDecoration:'underline'}}>{ul[2]}</span>);
              rest=rest.slice(ul[0].length);
              continue;
            }
            // No more tokens — rest is plain text
            parts.push(<span key={key++}>{rest}</span>);
            break;
          }
          return(
            <div key={li} style={{
              marginBottom: li<lines.length-1?4:0,
              fontWeight: isHeading?700:400,
              fontSize:"inherit",
              lineHeight:"inherit",
              ...(bullet?{display:'flex',gap:8}:{}),
            }}>
              {bullet?<><span style={{color:'var(--pri)',fontWeight:800,flexShrink:0}}>•</span><span>{parts}</span></>:parts}
            </div>
          );
        })}
      </div>
    );
  });
}




// Detect sensible unit based on activity name — order matters: more specific first
function detectUnit(name){
  const n=(name||'').toLowerCase();
  // Incline ONLY maps to % when it's a treadmill/cardio exercise
  if(/incline.*(treadmill|walk|run|jog)/i.test(n)) return '%';
  if(/treadmill|walk(?!ing lunge)|run|jog|bike|cycle|row(?!ing)|swim|cardio|stair/i.test(n)) return 'min';
  if(/plank|hold|stretch|yoga|foam/i.test(n)) return 'sec';
  // Everything else (pushups, curls, squats, etc.) = weight in kg
  return 'kg';
}

function Deferred({render,minHeight=200}){

// M3 Expressive shape library (polar "cookie"/"flower" outlines), cached as SVG paths in a 100×100 box
const _shapes={};
function shapePath(kind){
  if(_shapes[kind])return _shapes[kind];
  const [n,a]=({cookie4:[4,.12],cookie6:[6,.09],cookie9:[9,.07],cookie12:[12,.05],flower:[8,.14],sunny:[16,.035],clover:[4,.22]})[kind]||[9,.07];
  let d='';
  for(let i=0;i<=360;i+=2){const t=i*Math.PI/180;const r=47*(1+a*Math.cos(n*t))/(1+a);
    d+=(i?'L':'M')+(50+r*Math.cos(t)).toFixed(2)+' '+(50+r*Math.sin(t)).toFixed(2);}
  return _shapes[kind]=d+'Z';
}
